name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - ".mkdocs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - ".mkdocs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# The site is published on a push to main, and when the workflow is run by hand:
# from main upstream, or from any branch in a fork (a preview of that branch).
env:
  PUBLISH: >-
    ${{ github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.ref == 'refs/heads/main' || github.repository != 'litmuschaos/litmus-lite')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Point the site at this repository's Pages address
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - name: Build (fails on a broken link or a missing example)
        run: mkdocs build --strict
      - if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.repository != 'litmuschaos/litmus-lite'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
