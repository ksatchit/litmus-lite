name: litmus-lite
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap checks that do not depend on the OS.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: known vulnerabilities in the code that is called
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Linux: the oldest Go the module claims (go.mod) and the current one, with
  # the race detector. Then the built binary is exercised the way a user would.
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race ./...
      - run: go build -o litmus-lite ./cmd/litmus-lite
      - name: smoke
        run: |
          ./litmus-lite version
          ./litmus-lite validate examples/cashier/charge.chaos.yaml
          ./litmus-lite validate examples/cashier/charge-slow.chaos.yaml
          ./litmus-lite mcp eval
          ./litmus-lite move-to -adapter ir examples/cashier/charge.chaos.yaml
          ./litmus-lite hub list

  # The README's quick start, as written: a green run (exit 0) and a red run
  # (exit 3) against the sample service. If either answer changes, so does the
  # first thing a new user sees.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -o litmus-lite ./cmd/litmus-lite
      - run: go build -o cashier ./examples/cashier
      - name: green and red
        run: |
          LITMUS_LITE_FAILPOINT=charge,charge-slow LITMUS_LITE_FAILPOINT_TOKEN=cashier-demo ./cashier &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fs localhost:8080/charge >/dev/null && break; sleep 0.2; done
          export LITMUS_LITE_LIVE=off
          ./litmus-lite validate -strict examples/cashier/charge.chaos.yaml
          ./litmus-lite run -out green.json examples/cashier/charge.chaos.yaml
          set +e
          ./litmus-lite run -out red.json examples/cashier/charge-must-survive.chaos.yaml
          code=$?
          set -e
          if [ "$code" != "3" ]; then echo "the red run exited $code, want 3"; exit 1; fi
          ./litmus-lite diagnose red.json

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...

  # No -race here: the detector needs cgo and a C toolchain, which this
  # runner is not set up for in a way worth the trouble.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - run: go build -o litmus-lite.exe ./cmd/litmus-lite
      - run: ./litmus-lite.exe validate examples/cashier/charge.chaos.yaml

  # A snapshot release builds all six targets (linux, darwin, windows, each
  # amd64 and arm64), the archives, the checksums and the Homebrew cask,
  # without publishing anything. A broken .goreleaser.yaml fails here, on the
  # pull request, and not on the day of a release.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: six archives and a checksum file
        run: |
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" = 6
          test -s dist/checksums.txt
