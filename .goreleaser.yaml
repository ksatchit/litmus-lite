version: 2
project_name: litmus-lite

# Tests and `go mod tidy` run in the release workflow before this job starts
# (see .github/workflows/release.yml), so a hook here cannot fail a release
# half-way, and a tidy cannot dirty the tree goreleaser checks.

builds:
  - id: litmus-lite
    main: ./cmd/litmus-lite
    binary: litmus-lite
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
