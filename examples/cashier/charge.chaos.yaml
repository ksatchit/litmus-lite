# Mode B. Start examples/cashier with:
#   LITMUS_LITE_FAILPOINT=charge,charge-slow
#   LITMUS_LITE_FAILPOINT_TOKEN=cashier-demo
# The token below must match that process. The charge hook stays off until this run arms it.
apiVersion: litmus-lite.io/v1
kind: Scenario
metadata:
  name: cashier-charge
target:
  kind: http
  baseUrl: http://127.0.0.1:8091
baseline: 3s
recover: 4s
steadyState:
  - name: healthz
    type: http
    url: http://127.0.0.1:8091/healthz
    expect: { status: 200 }
    mode: SOT
faults:
  - name: charge-fails
    kind: failpoint
    duration: 8s
    params:
      url: http://127.0.0.1:8091/_litmus/failpoint
      name: charge
      token: cashier-demo
probes:
  - name: charge
    type: http
    url: http://127.0.0.1:8091/charge
    interval: 200ms
    timeout: 1s
    mode: continuous
    expect: { status: 200 }
hypotheses:
  - name: hook-landed
    metric: error_rate
    operator: ">"
    value: "50%"
  - name: recovers
    metric: recovery
    operator: <=
    value: 5s
rollback: always
